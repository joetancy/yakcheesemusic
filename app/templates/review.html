{% extends "base.html" %}
{% block title %}Review - yakcheesemusic{% endblock %}
{% block content %}
<h1>Needs review / Failed / Skipped</h1>
<table class="rtable"><tr><th>Title</th><th>Artist</th><th>Status</th><th></th></tr>
{% for t in tracks %}<tr><td data-label="Title">{{ t.title }}</td><td data-label="Artist">{{ t.artist }}</td><td data-label="Status">{{ t.status }}</td><td><a href="/review/{{ t.id }}">Review</a></td></tr>{% else %}<tr><td colspan="4">Nothing to review.</td></tr>{% endfor %}
</table>
{% endblock %}
