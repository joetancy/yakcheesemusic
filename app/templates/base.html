<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}yakcheesemusic{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';}catch(e){}</script>
</head>
<body>
<header><nav>
<a href="/">Dashboard</a><a href="/playlists">Playlists</a><a href="/review">Review</a><a href="/settings">Settings</a>
<span class="muted">yakcheesemusic</span>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">◐</button>
</nav></header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
</body>
</html>
