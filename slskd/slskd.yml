# slskd config for music-sync. Fill in your Soulseek account below
# (free signup at https://www.slsknet.org), then `docker compose up -d slskd`.
directories:
  incomplete: /downloads/incomplete
  downloads: /downloads/complete
shares:
  directories:
    - /music
soulseek:
  description: music-sync
  username: ${SOULSEEK_USERNAME:-change-me}
  password: ${SOULSEEK_PASSWORD:-change-me}
  listen_port: 50300
web:
  port: 5030
  authentication:
    api_keys:
      musicsync:
        key: ${SLSKD_API_KEY:-change-me}
        role: readwrite
        cidr: 0.0.0.0/0
transfers:
  download:
    retry:
      attempts: 5
