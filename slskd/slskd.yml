# slskd config for yakcheesemusic. Fill in your Soulseek account below
# (free signup at https://www.slsknet.org), then `docker compose up -d slskd`.
directories:
  incomplete: /downloads/incomplete
  downloads: /downloads/complete
shares:
  directories:
    - /music
soulseek:
  description: yakcheesemusic
  # username/password come from SLSKD_SLSK_USERNAME / SLSKD_SLSK_PASSWORD
  # in .env (YAML would override env vars, so they must NOT be set here).
  listen_port: 50300
web:
  port: 5030
  authentication:
    # API key comes from the SLSKD_API_KEY env var (primary key, admin role).
    # Do NOT add api_keys here — slskd does not expand ${...} in this file.
transfers:
  download:
    retry:
      attempts: 5
