[project]
name = "yakcheesemusic"
version = "0.1.0"
description = "Self-hosted playlist sync: Spotify playlists as source of truth, Soulseek as download layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "jinja2>=3.1",
  "apscheduler>=3.10",
  "mutagen>=1.47",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "playwright>=1.40",
  "streamrip>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.21",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
